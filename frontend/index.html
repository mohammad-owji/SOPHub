<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPHub Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf7ff, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 390px;
            padding: 45px 38px;
            box-sizing: border-box;
            text-align: center;
            background: transparent;
        }

        .logo-circle {
            width: 95px;
            height: 95px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            background: #00a7ef;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            font-weight: bold;
            box-shadow: 0 12px 25px rgba(0, 167, 239, 0.25);
        }

        .hidden,
        .hidden-field {
            display: none;
        }

        .input-group,
        .role-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        input,
        select {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 26px;
            background: rgba(0, 167, 239, 0.12);
            color: #333;
            font-size: 15px;
            box-sizing: border-box;
        }

        input {
            padding: 0 22px 0 60px;
        }

        select {
            padding: 0 55px 0 22px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        input::placeholder {
            color: #666;
        }

        input:focus,
        select:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 2px rgba(0, 167, 239, 0.35);
        }

        .icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            z-index: 2;
        }

        .role-arrow {
            position: absolute;
            right: 23px;
            top: 50%;
            transform: translateY(-50%);
            color: #333;
            font-size: 13px;
            pointer-events: none;
        }

        #main-btn {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            background: #00a7ef;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #main-btn:hover {
            background: #008fd1;
        }

        #main-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #switch-link {
            display: block;
            margin-top: 18px;
            color: #00a7ef;
            text-decoration: none;
            font-size: 15px;
        }

        #switch-link:hover {
            color: #008fd1;
        }

        .message {
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo-circle">SOP</div>

        <div id="message" class="message hidden"></div>

        <div id="role-group" class="role-wrapper hidden-field">
            <select id="rolle">
                <option value="">Rolle auswählen</option>
                <option value="student">Student:in</option>
                <option value="professor">Professor:in</option>
            </select>
            <span class="role-arrow">▼</span>
        </div>

        <div class="input-group">
            <span class="icon">👤</span>
            <input id="benutzername" type="text" placeholder="Benutzername" autocomplete="username">
        </div>

        <div id="email-group" class="input-group hidden-field">
            <span class="icon">✉</span>
            <input id="email" type="email" placeholder="E-Mail" autocomplete="email">
        </div>

        <div class="input-group">
            <span class="icon">🔒</span>
            <input id="passwort" type="password" placeholder="Passwort" autocomplete="current-password">
        </div>

        <button id="main-btn">Anmelden</button>
        <a href="#" id="switch-link">Noch kein Konto? Registrieren</a>
    </div>

    <script>
        let mode = 'login';

        const btnEl = document.getElementById('main-btn');
        const linkEl = document.getElementById('switch-link');
        const roleEl = document.getElementById('rolle');
        const roleGroupEl = document.getElementById('role-group');
        const emailEl = document.getElementById('email');
        const emailGroupEl = document.getElementById('email-group');
        const msgEl = document.getElementById('message');

        btnEl.addEventListener('click', handleSubmit);

        linkEl.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo(mode === 'login' ? 'register' : 'login');
        });

        function switchTo(newMode) {
            mode = newMode;
            msgEl.className = 'message hidden';

            document.getElementById('benutzername').value = '';
            document.getElementById('passwort').value = '';
            emailEl.value = '';
            roleEl.value = '';

            if (mode === 'register') {
                emailGroupEl.classList.remove('hidden-field');
                roleGroupEl.classList.remove('hidden-field');

                btnEl.textContent = 'Registrieren';
                linkEl.textContent = 'Bereits registriert? Anmelden';
            } else {
                emailGroupEl.classList.add('hidden-field');
                roleGroupEl.classList.add('hidden-field');

                btnEl.textContent = 'Anmelden';
                linkEl.textContent = 'Noch kein Konto? Registrieren';
            }
        }

        async function handleSubmit() {
            const benutzername = document.getElementById('benutzername').value.trim();
            const password = document.getElementById('passwort').value;
            const email = emailEl.value.trim();
            const role = roleEl.value;

            if (!benutzername || !password) {
                showMessage('Bitte Benutzername und Passwort eingeben.', 'error');
                return;
            }

            if (mode === 'register' && (!email || !role)) {
                showMessage('Bitte E-Mail und Rolle auswählen.', 'error');
                return;
            }

            btnEl.disabled = true;

            try {
                const endpoint = mode === 'login' ? 'login' : 'register';

                const body = mode === 'login'
                    ? { benutzername, password }
                    : { benutzername, password, email, role };

                const res = await fetch(`http://localhost:8080/sop/api/auth/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    mode: 'cors'
                });

                const text = await res.text();

                if (res.ok && mode === 'register') {
                    showMessage(text, 'success');
                    setTimeout(() => switchTo('login'), 2000);
                } else {
                    showMessage(text, res.ok ? 'success' : 'error');
                }
            } catch (e) {
                showMessage('Server nicht erreichbar.', 'error');
            } finally {
                btnEl.disabled = false;
            }
        }

        function showMessage(text, type) {
            msgEl.textContent = text;
            msgEl.className = 'message ' + type;
        }
    </script>
</body>
</html>
