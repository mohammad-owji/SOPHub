# Eingebetteter LDAP-Server fuer lokales Testen
spring.ldap.embedded.base-dn=dc=sophub,dc=local
spring.ldap.embedded.ldif=classpath:test-users.ldif
spring.ldap.embedded.port=8389
spring.ldap.embedded.validation.enabled=false

ldap.url=ldap://localhost:8389
ldap.base=dc=sophub,dc=local
ldap.user-dn-pattern=uid={0},ou=people,dc=sophub,dc=local
